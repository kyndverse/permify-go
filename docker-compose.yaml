services:
  envoy:
    image: envoyproxy/envoy:v1.39.1
    container_name: permify-go-envoy
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./deployments/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - info